apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: household-service
  namespace: homehub
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: household-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
