apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-service
  namespace: homehub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: device-service
  template:
    metadata:
      labels:
        app: device-service
    spec:
      containers:
        - name: device-service
          image: YOUR_DOCKERHUB_USERNAME/homehub-device:0.1.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: homehub-config
            - secretRef:
                name: homehub-secrets
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: device-service
  namespace: homehub
spec:
  selector:
    app: device-service
  ports:
    - port: 8000
      targetPort: 8000
