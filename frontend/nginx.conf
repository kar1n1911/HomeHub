server {
  listen 80;
  server_name _;
  resolver ${HOMEHUB_DNS} valid=5s ipv6=off;
  resolver_timeout 3s;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_vary on;

  # Vite fingerprints these filenames, so cached assets are safe across releases.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }


  location /api/households {
    set $household_service "household-service${HOMEHUB_DOMAIN}:8000";
    proxy_pass http://$household_service;
    proxy_set_header Host $host;
  }

  location /api/tasks {
    set $task_service "task-service${HOMEHUB_DOMAIN}:8000";
    proxy_pass http://$task_service;
    proxy_set_header Host $host;
  }

  location /api/devices {
    set $device_service "device-service${HOMEHUB_DOMAIN}:8000";
    proxy_pass http://$device_service;
    proxy_set_header Host $host;
  }

  location /api/signals {
    set $alertmanager "alertmanager${HOMEHUB_DOMAIN}:8000";
    proxy_pass http://$alertmanager;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

